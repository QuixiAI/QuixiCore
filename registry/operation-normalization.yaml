  - attn_composites
  - base_q_fused_consumers
  - elementwise
  - flux
  - fp8_gemm_collectives
  - kv_cache_q8_0
  - marginal
  - moe
  - moe_quant
  - quant_rt
  - rope_variants
  - serving
  - standalone_collectives


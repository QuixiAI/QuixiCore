schema:
  type: object
  required:
    - backend
    - name
    - repo
    - umbrella
    - contract
    - status
    - targets
  additional_properties: false
  properties:
    backend:
      type: string
      enum:
        - cuda
        - metal
        - rocm
        - xpu
        - gaudi
        - cpu
    name:
      type: string
    repo:
      type: string
      pattern: "^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$"
    umbrella:
      type: string
      const: QuixiAI/QuixiCore
    contract:
      type: string
      pattern: "^v[0-9]+\\.[0-9]+$"
    status:
      type: string
      enum:
        - active
        - planned
        - archived
    targets:
      type: array
      min_items: 1
      items:
        type: string
    upstream:
      type: string
    integrations:
      type: array
      items:
        type: string
    notes:
      type: string

examples:
  cuda:
    backend: cuda
    name: QuixiCore CUDA
    repo: QuixiAI/QuixiCore-CUDA
    umbrella: QuixiAI/QuixiCore
    contract: v0.1
    status: active
    targets:
      - sm80
      - sm86
      - sm89
      - sm90
      - sm100
    integrations:
      - CUDA
  rocm:
    backend: rocm
    name: QuixiCore ROCm
    repo: QuixiAI/QuixiCore-ROCm
    umbrella: QuixiAI/QuixiCore
    contract: v0.1
    status: active
    targets:
      - cdna2
      - cdna3
      - cdna4
    integrations:
      - ROCm
      - HIP
  cpu:
    backend: cpu
    name: QuixiCore CPU
    repo: QuixiAI/QuixiCore-CPU
    umbrella: QuixiAI/QuixiCore
    contract: v0.1
    status: active
    targets:
      - x86_64
      - aarch64
    integrations:
      - SIMD
      - threading
